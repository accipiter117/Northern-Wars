<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d1610">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Northern Wars">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="description" content="Northern Wars: rule the Kingdom of Temeria. A fan-made kingdom simulator.">
  <title>Northern Wars</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <div class="bar-main">
      <div class="when">
        <span id="date">&nbsp;</span>
        <span id="season" class="season">&nbsp;</span>
      </div>
      <div class="speeds" role="group" aria-label="Speed">
        <button type="button" data-speed="0" aria-label="Pause">&#10074;&#10074;</button>
        <button type="button" data-speed="1" aria-label="Normal speed">1&times;</button>
        <button type="button" data-speed="2" aria-label="Double speed">2&times;</button>
        <button type="button" data-speed="4" aria-label="Fastest speed">4&times;</button>
      </div>
      <button type="button" id="more-button" class="icon-button" aria-label="More: chronicle, help, saves" aria-haspopup="true" aria-expanded="false"></button>
    </div>
    <div class="meters">
      <button type="button" class="meter" data-go="meter:treasury" aria-label="Treasury: why it changed"><span class="m-name" data-icon="coin">Treasury</span><span class="m-val" id="m-treasury">0</span></button>
      <button type="button" class="meter" data-go="meter:granary" aria-label="Granary: why it changed"><span class="m-name" data-icon="wheat">Granary</span><span class="m-val" id="m-granary">0</span></button>
      <button type="button" class="meter" data-go="meter:trust" aria-label="Trust in the Crown: why it changed"><span class="m-name" data-icon="crown">Trust</span><span class="m-val" id="m-trust">0</span></button>
      <button type="button" class="meter" data-go="meter:unrest" aria-label="Unrest: why it changed"><span class="m-name" data-icon="flame">Unrest</span><span class="m-val" id="m-unrest">0</span></button>
      <button type="button" class="meter" data-go="meter:dread" aria-label="Dread: why it changed"><span class="m-name" data-icon="moon">Dread</span><span class="m-val" id="m-dread">0</span></button>
    </div>
    <div id="urgent" class="urgent" role="alert" hidden></div>
    <div id="pickbar" class="pickbar" role="status" hidden></div>
  </header>

  <main id="stage">
    <canvas id="map" aria-label="Map of Temeria"></canvas>
    <button type="button" id="pressure" class="pressure"></button>
    <div id="unit-label" class="unit-label" hidden></div>
    <div id="press-ring" class="press-ring" hidden></div>
    <div id="quick-ring" class="quick-ring" hidden></div>
    <div id="loading" class="loading">Unrolling the map of Temeria</div>
  </main>

  <aside id="sheet" class="sheet" hidden aria-live="polite">
    <div id="sheet-head" class="sheet-head">
      <span class="grabber" aria-hidden="true"></span>
      <button type="button" id="sheet-back" class="icon-button sheet-back" aria-label="Back" hidden></button>
      <h2 id="sheet-title"></h2>
      <button type="button" id="sheet-close" class="icon-button sheet-close" aria-label="Close"></button>
    </div>
    <div id="sheet-body"></div>
  </aside>

  <nav id="tabbar" class="tabbar" aria-label="Screens"></nav>
  <div id="more-menu" class="more-menu" role="menu" hidden></div>

  <div id="hint" class="hint" role="note" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="peek" class="peek" role="dialog" hidden></div>
  <div id="audience" class="audience" role="dialog" aria-modal="true" aria-label="An audience" hidden></div>
  <div id="update" class="update" role="status" hidden>A new version is ready. <button type="button" id="update-restart">Restart</button></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script type="module" src="src/main.js"></script>
</body>
</html>
