<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d1610">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Northern Wars">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="description" content="Northern Wars: rule the Kingdom of Temeria. A fan-made kingdom simulator.">
  <title>Northern Wars</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <div class="bar-main">
      <div class="when">
        <span id="date">&nbsp;</span>
        <span id="season" class="season">&nbsp;</span>
      </div>
      <div class="speeds" role="group" aria-label="Speed">
        <button type="button" data-speed="0" aria-label="Pause">&#10074;&#10074;</button>
        <button type="button" data-speed="1" aria-label="Normal speed">1&times;</button>
        <button type="button" data-speed="2" aria-label="Double speed">2&times;</button>
        <button type="button" data-speed="4" aria-label="Fastest speed">4&times;</button>
      </div>
      <button type="button" id="hand-button" class="icon-button hand-button" data-go="hand" data-name="The crown's hand" aria-label="The crown's hand: acts ready and resting"><span class="hb-ico"></span><span class="hb-count" id="hand-count" hidden></span></button>
      <button type="button" id="more-button" class="icon-button" aria-label="More: chronicle, help, saves" aria-haspopup="true" aria-expanded="false"></button>
    </div>
    <!-- M24 A: the realm's goods as symbols and numbers, then the meters
         with thin bars. Each is a button opening its detail; a long press
         names it. -->
    <div class="tb-figures">
    <div class="goods" role="group" aria-label="The realm's goods">
      <button type="button" class="good coin" data-go="meter:treasury" data-name="Treasury" aria-label="Treasury"><span class="g-ico" data-icon="coin"></span><span class="g-val" id="m-treasury">0</span><span class="g-sub" id="m-treasury-change"></span></button>
      <button type="button" class="good" data-go="meter:granary" data-name="Grain" aria-label="Grain"><span class="g-ico" data-icon="wheat"></span><span class="g-val" id="m-granary">0</span></button>
      <button type="button" class="good" data-go="meter:fuel" data-name="Fuel" aria-label="Fuel"><span class="g-ico" data-icon="logs"></span><span class="g-val" id="m-fuel">0</span></button>
      <button type="button" class="good" data-go="meter:iron" data-name="Iron" aria-label="Iron"><span class="g-ico" data-icon="anvil"></span><span class="g-val" id="m-iron">0</span></button>
      <button type="button" class="good" data-go="meter:cloth" data-name="Cloth" aria-label="Cloth"><span class="g-ico" data-icon="cloth"></span><span class="g-val" id="m-cloth">0</span></button>
    </div>
    <div class="meters" id="meters" role="group" aria-label="The realm's mood"></div>
    </div>
    <div id="urgent" class="urgent" role="alert" hidden></div>
    <div id="pickbar" class="pickbar" role="status" hidden></div>
  </header>

  <main id="stage">
    <canvas id="map" aria-label="Map of Temeria"></canvas>
    <button type="button" id="pressure" class="pressure"></button>
    <div id="unit-label" class="unit-label" hidden></div>
    <div id="press-ring" class="press-ring" hidden></div>
    <div id="quick-ring" class="quick-ring" hidden></div>
    <div id="loading" class="loading">Unrolling the map of Temeria</div>
  </main>

  <aside id="sheet" class="sheet" hidden aria-live="polite">
    <div id="sheet-head" class="sheet-head">
      <span class="grabber" aria-hidden="true"></span>
      <button type="button" id="sheet-back" class="icon-button sheet-back" aria-label="Back" hidden></button>
      <h2 id="sheet-title"></h2>
      <button type="button" id="sheet-close" class="icon-button sheet-close" aria-label="Close"></button>
    </div>
    <div id="sheet-body"></div>
  </aside>

  <nav id="tabbar" class="tabbar" aria-label="Screens"></nav>
  <div id="more-menu" class="more-menu" role="menu" hidden></div>

  <div id="hint" class="hint" role="note" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="undo" class="toast undo" role="status" hidden><span id="undo-text"></span><button type="button" id="undo-go" class="act small"><span class="act-label">Undo</span></button></div>
  <div id="dialog" class="dialog-veil" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-text">
      <p id="dialog-text"></p>
      <div class="dialog-actions">
        <button type="button" id="dialog-no" class="act"><span class="act-label">Cancel</span></button>
        <button type="button" id="dialog-yes" class="act danger"><span class="act-label">Yes</span></button>
      </div>
    </div>
  </div>
  <div id="peek" class="peek" role="dialog" hidden></div>
  <div id="audience" class="audience" role="dialog" aria-modal="true" aria-label="An audience" hidden></div>
  <div id="update" class="update" role="status" hidden>A new version is ready. <button type="button" id="update-restart">Restart</button></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script type="module" src="src/main.js"></script>
</body>
</html>
